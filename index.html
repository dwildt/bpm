<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="8-bit style BPM calculator - tap the button or press spacebar to find the tempo">
    <title>BPM Calculator</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect fill='%2300ff00' width='16' height='16'/><text x='50%25' y='50%25' dominant-baseline='middle' text-anchor='middle' font-family='monospace' font-size='12' fill='%23000'>♪</text></svg>">

    <!-- Google Fonts - Press Start 2P for 8-bit aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="title">BPM CALCULATOR</h1>
        </header>

        <main class="main">
            <!-- BPM Display -->
            <div class="bpm-display">
                <div class="bpm-label">BPM</div>
                <div class="bpm-value" id="bpmValue">---</div>
            </div>

            <!-- Tap Button -->
            <button class="tap-button" id="tapButton" aria-label="Tap to calculate BPM">
                <span class="tap-text">TAP HERE</span>
                <span class="tap-hint">(or spacebar)</span>
            </button>

            <!-- Metronome Controls Section -->
            <div class="metronome-section">
                <button class="fix-bpm-button" id="fixBpmButton"
                        aria-label="Lock current BPM for metronome"
                        disabled>
                    FIX BPM
                </button>

                <div class="metronome-display">
                    <span class="metronome-label">FIXED:</span>
                    <span class="metronome-value" id="fixedBpmValue">---</span>
                </div>

                <button class="play-metronome-button" id="playMetronomeButton"
                        aria-label="Start metronome"
                        disabled>
                    <span class="play-icon">▶</span>
                    <span class="play-text">PLAY</span>
                </button>
            </div>

            <!-- Manual BPM Input Section -->
            <div class="manual-bpm-section">
                <button class="set-bpm-button" id="setBpmButton"
                        aria-label="Set BPM manually">
                    SET BPM
                </button>
            </div>

            <!-- Presets Management Section -->
            <div class="presets-section">
                <button class="save-preset-button" id="savePresetButton"
                        aria-label="Save current settings as preset"
                        disabled>
                    SAVE PRESET
                </button>
                <button class="manage-presets-button" id="managePresetsButton"
                        aria-label="Manage saved presets">
                    PRESETS
                </button>
            </div>

            <!-- BPM Input Modal -->
            <div class="modal-overlay" id="bpmModal" hidden>
                <div class="modal-content" role="dialog" aria-labelledby="modalTitle" aria-modal="true">
                    <h2 class="modal-title" id="modalTitle">SET BPM</h2>
                    <div class="modal-body">
                        <label for="bpmInput" class="modal-label">ENTER BPM (30-300):</label>
                        <input type="number"
                               id="bpmInput"
                               class="bpm-input"
                               min="30"
                               max="300"
                               step="1"
                               placeholder="120"
                               aria-describedby="bpmError"
                               autocomplete="off">
                        <div class="modal-error" id="bpmError" role="alert"></div>
                    </div>
                    <div class="modal-actions">
                        <button class="modal-button modal-confirm" id="confirmBpmButton">OK</button>
                        <button class="modal-button modal-cancel" id="cancelBpmButton">CANCEL</button>
                    </div>
                </div>
            </div>

            <!-- Presets Modal -->
            <div class="modal-overlay" id="presetsModal" hidden>
                <div class="modal-content presets-modal-content" role="dialog"
                     aria-labelledby="presetsTitle" aria-modal="true">
                    <h2 class="modal-title" id="presetsTitle">MANAGE PRESETS</h2>

                    <div class="modal-body">
                        <!-- Save New Preset Form -->
                        <div class="preset-save-form">
                            <label for="presetNameInput" class="modal-label">SAVE CURRENT AS:</label>
                            <input type="text"
                                   id="presetNameInput"
                                   class="preset-name-input"
                                   placeholder="e.g., Camila Camila"
                                   maxlength="30"
                                   autocomplete="off"
                                   aria-describedby="presetError">
                            <button class="preset-save-confirm" id="saveNewPresetButton">
                                SAVE PRESET
                            </button>
                            <div class="modal-error" id="presetError" role="alert"></div>
                        </div>

                        <!-- Saved Presets List -->
                        <div class="presets-list-container">
                            <h3 class="presets-list-title">SAVED PRESETS:</h3>
                            <div class="presets-list" id="presetsList">
                                <!-- Populated by JavaScript -->
                            </div>
                        </div>
                    </div>

                    <div class="modal-actions">
                        <button class="modal-button modal-cancel" id="closePresetsButton">CLOSE</button>
                    </div>
                </div>
            </div>

            <!-- Time Signature Selector -->
            <div class="time-signature-section">
                <label for="timeSignatureSelector" class="time-sig-label">TIME SIGNATURE:</label>
                <select id="timeSignatureSelector" class="time-sig-selector" aria-label="Select time signature">
                    <option value="4/4" selected>4/4 (Common Time)</option>
                    <option value="3/4">3/4 (Waltz)</option>
                    <option value="2/4">2/4 (March)</option>
                </select>
            </div>

            <!-- Subdivision Selector -->
            <div class="subdivision-section">
                <label for="subdivisionSelector" class="subdivision-label">SUBDIVISION:</label>
                <select id="subdivisionSelector" class="subdivision-selector" aria-label="Select subdivision">
                    <option value="1/4" selected>♩ Quarter Notes</option>
                    <option value="1/8">♪ Eighth Notes</option>
                    <option value="1/16">♬ Sixteenth Notes</option>
                    <option value="1/3">♪♪♪ Triplets</option>
                </select>
            </div>

            <!-- Beat Indicator -->
            <div class="beat-indicator" id="beatIndicator">
                <div class="beat-dot" data-beat="0"></div>
                <div class="beat-dot" data-beat="1"></div>
                <div class="beat-dot" data-beat="2"></div>
                <div class="beat-dot" data-beat="3"></div>
            </div>

            <!-- Instructions -->
            <div class="instructions">
                <p>Click the button or press SPACEBAR to tap along with the beat.</p>
                <p>The BPM will be calculated automatically.</p>
            </div>
        </main>

        <footer class="footer">
            <!-- Theme Switcher -->
            <div class="theme-selector">
                <span class="theme-label">THEME:</span>
                <button class="theme-button active" data-theme="classic" aria-label="Classic 8-bit theme" title="Classic 8-bit">
                    <span class="theme-color" style="background: #00ff00;"></span>
                    <span class="theme-color" style="background: #ff00ff;"></span>
                    <span class="theme-color" style="background: #00ffff;"></span>
                </button>
                <button class="theme-button" data-theme="severance" aria-label="Severance theme" title="Severance">
                    <span class="theme-color" style="background: #2f4858;"></span>
                    <span class="theme-color" style="background: #1a3a3a;"></span>
                    <span class="theme-color" style="background: #4a7c7e;"></span>
                </button>
                <button class="theme-button" data-theme="wildtech" aria-label="Wildtech theme" title="Wildtech">
                    <span class="theme-color" style="background: #ff7b00;"></span>
                    <span class="theme-color" style="background: #8b4513;"></span>
                    <span class="theme-color" style="background: #d4a574;"></span>
                </button>
            </div>

            <p>Made with retro vibes | Built with <a href="https://claude.ai/code" target="_blank" rel="noopener">Claude Code</a></p>
            <p>
                <a href="https://github.com/dwildt/bpm" target="_blank" rel="noopener">View on GitHub</a> |
                <a href="https://github.com/sponsors/dwildt" target="_blank" rel="noopener">Sponsor</a>
            </p>
        </footer>
    </div>

    <script src="bpm.js"></script>
    <script src="metronome.js"></script>
    <script type="module" src="presets.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
